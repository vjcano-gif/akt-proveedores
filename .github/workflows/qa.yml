name: QA

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "fix/**"]

jobs:
  sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install OCR system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-spa libgl1 libglib2.0-0
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile
        run: python -m compileall core app_pages streamlit_app.py
      - name: End-to-end SQLite
        run: python tests/test_flujo.py

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: akt_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d akt_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/akt_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install OCR system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-spa libgl1 libglib2.0-0
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: End-to-end PostgreSQL
        run: python tests/test_flujo.py
