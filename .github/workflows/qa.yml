name: QA

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "fix/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile
        run: python -m compileall core app_pages streamlit_app.py
      - name: End-to-end tests
        run: python tests/test_flujo.py
